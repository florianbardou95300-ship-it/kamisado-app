name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Write bundle version
        run: 'echo "{\"version\": \"${{ github.run_number }}\"}" > www/version.json'

      - name: Package web bundle for in-app updates
        working-directory: www
        run: zip -r ../samourai-web-bundle.zip . -x ".*"

      - name: Checksum web bundle (requis par capacitor-updater)
        id: checksum
        run: |
          SUM=$(sha256sum samourai-web-bundle.zip | awk '{print $1}')
          echo "$SUM" > samourai-web-bundle.sha256
          echo "sum=$SUM" >> "$GITHUB_OUTPUT"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kamisado-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref_name == 'main' || github.ref_name == 'master'
        with:
          tag_name: build-${{ github.run_number }}
          name: Kamisado — build ${{ github.run_number }}
          body: "bundle-sha256:${{ steps.checksum.outputs.sum }}"
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            samourai-web-bundle.zip
            samourai-web-bundle.sha256
