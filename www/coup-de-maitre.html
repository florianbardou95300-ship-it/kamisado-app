<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Coup de Maître</title>
<style>
:root{
  --felt:#0f2f2a; --felt2:#174a41; --ink:#1d1d24; --cream:#fbf6ea; --red:#c8323c;
  --chips:#2f7de1; --mult:#e5484d; --gold:#f2b632; --panel:rgba(0,0,0,.28); --muted:#a9c7bf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff;background:radial-gradient(ellipse 70% 40% at 15% 0%,rgba(70,90,255,.35),transparent 70%),radial-gradient(ellipse 70% 40% at 85% 100%,rgba(255,40,80,.35),transparent 70%),radial-gradient(ellipse at 50% 40%,#16163a,#07071a 75%) fixed;user-select:none;-webkit-user-select:none;overflow-x:hidden;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:7px;
  padding:calc(26px + env(safe-area-inset-top)) calc(27px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(27px + env(safe-area-inset-left))}

/* Ampoules façon enseigne */
#frame{position:fixed;top:calc(4px + env(safe-area-inset-top));bottom:calc(4px + env(safe-area-inset-bottom));left:calc(4px + env(safe-area-inset-left));right:calc(4px + env(safe-area-inset-right));
  border:2px solid rgba(190,110,255,.8);border-radius:18px;box-shadow:0 0 12px rgba(170,90,255,.7),inset 0 0 12px rgba(170,90,255,.45);pointer-events:none;z-index:3}
.bl{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 38% 35%,#fff 0 18%,var(--c) 45%,var(--c2) 100%);box-shadow:0 0 6px 2px var(--c),0 0 14px 3px var(--c2);
  animation:chase 1.05s infinite}
.bl.p1{animation-delay:-.35s}.bl.p2{animation-delay:-.7s}
.fast .bl{animation-duration:.3s}
@keyframes chase{0%,33%{opacity:1}33.5%,100%{opacity:.22}}
header{display:flex;align-items:center;justify-content:space-between}
.hdr-left,.hdr-right{display:flex;gap:6px;align-items:center}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.5px}
h1 span{color:var(--gold)}
.pill{background:var(--panel);border-radius:999px;padding:4px 10px;font-weight:700;font-size:15px;position:relative}
.money{color:var(--gold)}
.iconbtn{background:var(--panel);border:0;color:#fff;border-radius:999px;width:30px;height:30px;font-weight:800;font-size:15px;padding:0}
.panel{background:var(--panel);border-radius:12px;padding:8px 10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#defiName{font-weight:800;font-size:15px}
#defiName.boss{color:var(--gold)}
.small{font-size:12px;color:var(--muted)}
.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.2)}}

/* Objectif + score */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.goal{position:relative;background:radial-gradient(ellipse at 50% 40%,#b0151b,#5a0509 80%);border:3px solid #ffb43a;border-radius:14px;text-align:center;padding:16px 14px 14px;box-shadow:0 0 18px rgba(255,170,40,.6),inset 0 0 18px rgba(0,0,0,.5);animation:goalglow 2.2s ease-in-out infinite}
@keyframes goalglow{50%{box-shadow:0 0 26px rgba(242,182,50,.8),inset 0 0 16px rgba(242,182,50,.4)}}
.goal .lbl,.scorebox .lbl{font-size:10px;letter-spacing:2.5px;font-weight:800;color:#ffd77a}
.goal .num{font-size:26px;font-weight:900;line-height:1.1;text-shadow:0 0 10px rgba(242,182,50,.9)}
.goal .rew{font-size:11px;color:#ffe3a3}
.scorebox{position:relative;background:radial-gradient(ellipse at 50% 45%,#2a1060,#0c0624 80%);border:3px solid #a96bff;border-radius:14px;text-align:center;padding:16px 14px 14px;overflow:visible;box-shadow:0 0 16px rgba(169,107,255,.7),inset 0 0 14px rgba(169,107,255,.35)}
.scorebox .lbl{color:#d6b8ff}
#scoreWrap{height:40px;display:flex;align-items:center;justify-content:center;position:relative;z-index:4}
#scoreScale{display:inline-block;transition:transform .25s ease-out}
#score{display:inline-block;font-size:26px;font-weight:900;transition:color .3s}
#score.warm{color:#ffe08a;text-shadow:0 0 12px rgba(255,200,80,.8);animation:wobble .8s ease-in-out infinite}
#score.hot{color:#ff8a4c;text-shadow:0 0 18px rgba(255,90,40,.95),0 0 4px #fff;animation:shake .13s linear infinite}
#score.boom{animation:boom .8s ease-out}
@keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) scale(1.05)}}
@keyframes shake{0%{transform:translate(1px,-1px) rotate(-1deg)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,2px) rotate(1deg)}75%{transform:translate(-1px,-2px)}100%{transform:translate(1px,1px)}}
@keyframes boom{0%{transform:scale(1)}30%{transform:scale(2.3);color:#fff;text-shadow:0 0 40px #fff,0 0 20px var(--gold)}100%{transform:scale(1)}}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--chips),var(--gold));width:0;transition:width .3s}
.bar.hot>div{background:linear-gradient(90deg,var(--gold),#ff5a2a);animation:barpulse .4s infinite}
@keyframes barpulse{50%{filter:brightness(1.5)}}
.counters{display:flex;gap:6px;margin-top:6px}
.counter{flex:1;text-align:center;background:rgba(0,0,0,.25);border-radius:8px;padding:3px 0;font-size:11px;color:var(--muted)}
.counter b{display:block;font-size:16px;color:#fff}
.counter.h b{color:#7fb3ff} .counter.d b{color:#ff8a8d}
.spark{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:60;animation:spark .95s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(600deg);opacity:0}}
#flashFx{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:55}
#flashFx.on{animation:flashfx .5s}
@keyframes flashfx{0%{opacity:.7}100%{opacity:0}}

/* Atouts & charmes */
#atouts{display:flex;gap:6px}
.slot{flex:1;height:72px;border-radius:10px;border:2px dashed rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-width:0}
.atout{border:2px solid var(--gold);background:linear-gradient(160deg,#3b2a5c,#22183a);cursor:pointer}
.atout .ic{font-size:24px;line-height:1}
.atout .nm{font-size:9px;text-align:center;padding:3px 2px 0;line-height:1.1;overflow:hidden;max-height:22px}
.atout .val{position:absolute;top:2px;right:4px;font-size:9px;color:var(--gold);font-weight:800}
.atout.flash{animation:flash .35s}
@keyframes flash{50%{transform:scale(1.12) rotate(-3deg);box-shadow:0 0 14px var(--gold)}}
#charmes{display:flex;gap:6px;align-items:center}
#charmes .lbl{font-size:11px;color:var(--muted);width:56px}
.chslot{flex:1;height:32px;border-radius:9px;border:2px dashed rgba(255,154,209,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;gap:4px;padding:0 4px;overflow:hidden;white-space:nowrap}
.chslot.full{border:2px solid #ff9ad1;background:linear-gradient(160deg,#5a1d3a,#2e0f20);cursor:pointer}

/* Calcul */
#calc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px}
#handName{font-weight:800;font-size:15px;min-height:19px;text-align:center}
#handName .lv{font-size:11px;color:var(--muted);font-weight:600}
.calc{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px}
.calc .chips,.calc .mult{min-width:76px;text-align:center;border-radius:8px;padding:3px 8px}
.calc .chips{background:var(--chips)} .calc .mult{background:var(--mult)}
#total{font-size:20px;font-weight:800;color:var(--gold);min-height:24px}

/* Cartes */
#table{min-height:82px;display:flex;justify-content:center;align-items:center;gap:6px;position:relative}
#table .hint{color:var(--muted);font-size:13px;text-align:center}
.card{position:relative;background:var(--cream);color:var(--ink);border-radius:8px;aspect-ratio:5/7;box-shadow:0 3px 0 rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.card.red{color:var(--red)}
.card .r{position:absolute;top:3px;left:5px;font-weight:800;font-size:clamp(12px,3.6vw,17px);line-height:1}
.card .s{font-size:clamp(18px,6vw,30px)}
.card .s2{position:absolute;bottom:2px;right:5px;font-size:clamp(9px,2.6vw,12px)}
.card .eb{position:absolute;top:2px;right:2px;font-size:clamp(9px,2.6vw,12px)}
.card.e-flamme{background:linear-gradient(170deg,#fff4ea,#ffc89e)}
.card.e-cristal{background:linear-gradient(170deg,#f2fbff,#b9e4ff)}
.card.e-doree{background:linear-gradient(170deg,#fff8d6,#ffd75e);box-shadow:0 0 0 2px #d9a514,0 3px 0 rgba(0,0,0,.35)}
.card.e-acier{background:linear-gradient(170deg,#f3f5f8,#b9c0cc)}
#hand{display:flex;justify-content:center;gap:4px;padding-top:18px}
#hand .card{flex:0 0 calc((100% - 32px)/9);max-width:60px;cursor:pointer}
#hand.n8 .card{flex-basis:calc((100% - 28px)/8)}
#hand .card.sel{transform:translateY(-16px);box-shadow:0 0 0 3px var(--gold),0 6px 0 rgba(0,0,0,.35)}
#hand .card.deal{animation:deal .32s ease-out backwards}
@keyframes deal{from{transform:translate(-140px,-220px) rotate(-30deg);opacity:0}}
#table .card{width:clamp(44px,15vw,62px)}
#table .card.score{box-shadow:0 0 0 3px var(--chips),0 3px 0 rgba(0,0,0,.35);transform:translateY(-6px)}
#table .card.dim{opacity:.45}
.pop{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-weight:800;font-size:13px;white-space:nowrap;padding:1px 6px;border-radius:6px;background:var(--chips);color:#fff;animation:pop .9s forwards;pointer-events:none;z-index:5}
.pop.m{background:var(--mult)} .pop.g{background:var(--gold);color:#222}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px)}20%{opacity:1;transform:translate(-50%,-6px)}100%{opacity:0;transform:translate(-50%,-26px)}}

/* Boutons */
#sorters{display:flex;justify-content:center;gap:6px}
.btn{border:0;border-radius:10px;padding:12px 10px;font-family:inherit;font-weight:800;font-size:15px;color:#fff;cursor:pointer}
.btn:disabled{opacity:.35}
.btn.sm{padding:6px 12px;font-size:12px;background:var(--panel)}
#controls{display:flex;gap:8px}
#controls .btn{flex:1}
.play{background:var(--chips)} .disc{background:var(--mult)} .goldb{background:var(--gold);color:#222} .ghost{background:rgba(255,255,255,.12)}

/* Boutique */
#shop h2{margin:0 0 4px;font-size:18px}
.offers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.offer{background:rgba(0,0,0,.3);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;border:2px solid var(--gold)}
.offer .top{display:flex;align-items:center;gap:6px}
.offer .ic{font-size:26px}
.offer .tag{font-size:10px;letter-spacing:1.5px;font-weight:800;color:var(--gold)}
.offer .nm{font-weight:800;font-size:13px;line-height:1.15}
.offer .ds{font-size:12px;color:#dfe9e6;flex:1}
.offer .btn{padding:8px;font-size:13px}
.offer.sold{opacity:.35;border-style:dashed}
.offer.scroll{background:linear-gradient(160deg,#4a3a17,#2a210d);border-color:#e7c46a}
.offer.charm{background:linear-gradient(160deg,#5a1d3a,#2e0f20);border-color:#ff9ad1}
.offer.charm .tag{color:#ff9ad1}
.reroll{width:100%;margin-top:10px;background:linear-gradient(90deg,#8a3ae8,#e8833a);font-size:16px}
.shopbar{display:flex;gap:8px;margin-top:8px}
.shopbar .btn{flex:1}

/* Modales */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
#modal[hidden]{display:none}
.box{background:#16322d;border:2px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;max-width:420px;width:100%;max-height:85vh;overflow:auto}
.box h3{margin:0 0 8px;font-size:19px}
.box p{margin:6px 0;font-size:14px;line-height:1.4;color:#e4efec}
.box .btns{display:flex;gap:8px;margin-top:12px}
.box .btns .btn{flex:1}
table.lv{width:100%;border-collapse:collapse;font-size:13px}
table.lv td{padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
table.lv td.c{color:#8fbaff;text-align:right} table.lv td.m{color:#ff9a9d;text-align:right}
.sumrow{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="frame"></div>
<div id="flashFx"></div>

<div id="app">
  <header>
    <div class="hdr-left"><button class="iconbtn hidden" id="btnQuit" title="Retour">‹</button><h1>Coup de <span>Maître</span></h1></div>
    <div class="hdr-right">
      <span class="pill money" id="money">$4</span>
      <button class="iconbtn" id="btnMute" title="Son">🔊</button>
      <button class="iconbtn" id="btnLevels" title="Mains">♣</button>
      <button class="iconbtn" id="btnHelp" title="Règles">?</button>
    </div>
  </header>

  <section id="status" class="panel">
    <div class="row"><span id="defiName">Petit défi</span><span class="small" id="miseLbl">Mise 1/8</span></div>
    <div class="duo">
      <div class="goal"><div class="lbl">🎯 OBJECTIF</div><div class="num" id="target">300</div><div class="rew" id="reward">Récompense $3</div></div>
      <div class="scorebox"><div class="lbl">SCORE</div><div id="scoreWrap"><span id="scoreScale"><span id="score">0</span></span></div></div>
    </div>
    <div class="bar" id="barBox"><div id="bar"></div></div>
    <div class="counters">
      <div class="counter h"><b id="handsLeft">4</b>Mains</div>
      <div class="counter d"><b id="discLeft">3</b>Défausses</div>
      <div class="counter"><b id="deckLeft">44</b>Pioche</div>
    </div>
  </section>

  <section id="atouts"></section>
  <section id="charmes"></section>

  <div id="playZone">
    <section id="calc" class="panel">
      <div id="handName"></div>
      <div class="calc"><span class="chips" id="chips">0</span>×<span class="mult" id="mult">0</span></div>
      <div id="total"></div>
    </section>
    <section id="table"></section>
    <section id="hand"></section>
    <div id="sorters" style="margin-top:8px">
      <button class="btn sm" id="sortRank">Trier par rang</button>
      <button class="btn sm" id="sortSuit">Trier par couleur</button>
    </div>
    <section id="controls" style="margin-top:8px">
      <button class="btn disc" id="btnDiscard">Défausser</button>
      <button class="btn play" id="btnPlay">Jouer</button>
    </section>
  </div>

  <section id="shop" class="panel hidden"></section>
</div>

<div id="modal" hidden><div class="box" id="modalBox"></div></div>

<script>
// =============== Données ===============
const SUITS=['♠','♥','♣','♦'];
const RLBL={11:'V',12:'D',13:'R',14:'A'};
const rl=r=>RLBL[r]||String(r);
const IN_APP=/coup-de-maitre\.html$/.test(location.pathname);
const HANDS={
  haute:{n:'Carte haute',c:5,m:1,dc:10,dm:1},
  paire:{n:'Paire',c:12,m:2,dc:15,dm:1},
  double:{n:'Double paire',c:22,m:2,dc:20,dm:1},
  brelan:{n:'Brelan',c:30,m:3,dc:20,dm:2},
  suite:{n:'Suite',c:35,m:4,dc:30,dm:3},
  couleur:{n:'Couleur',c:38,m:4,dc:15,dm:2},
  full:{n:'Full',c:45,m:4,dc:25,dm:2},
  carre:{n:'Carré',c:65,m:6,dc:30,dm:3},
  qf:{n:'Quinte flush',c:110,m:8,dc:40,dm:4}
};
const BASE_T=[300,700,1600,4000,9000,18000,32000,55000];
const DEFIS=['Petit défi','Grand défi','Défi du Maître'];
const DEFI_MUL=[1,1.5,2];
const DEFI_REWARD=[3,4,5];
const MAX_ATOUTS=5, MAX_CH=2;

// Atouts : card(k,ctx,a) pour chaque carte qui compte, held(k,ctx,a) pour chaque carte restée en main,
// hand(ctx,a) après les cartes, after(ctx,a) après le calcul, discard(cartes,a), start(a) début de défi, end(a) fin de défi (renvoie des $)
const ATOUTS={
  saltimbanque:{n:'Le Saltimbanque',i:'🎭',p:3,d:'+15 Base et +3 Multi',
    hand:c=>{c.chips+=15;c.mult+=3;return['+15 / +3','m']}},
  artichaut:{n:"Cœur d'artichaut",i:'💗',p:5,d:'Chaque ♥ qui compte : +12 Base et +1 Multi',
    card:(k,c)=>{if(k.s===1){c.chips+=12;c.mult+=1;return['+12 / +1','m']}}},
  piquenique:{n:'Pique-nique',i:'🧺',p:5,d:'Chaque ♠ qui compte : +20 Base',
    card:(k,c)=>{if(k.s===0){c.chips+=20;return['+20','c']}}},
  trefle:{n:'Trèfle porte-bonheur',i:'🍀',p:5,d:'Chaque ♣ qui compte : +1 $ (un ♣ joué qui ne fait pas partie de la combinaison ne rapporte rien)',
    card:k=>{if(k.s===2){gain(1);return['+1 $','g']}}},
  vitrail:{n:'Le Vitrail',i:'🔷',p:5,d:'Chaque ♦ qui compte : +10 Base et +2 Multi',
    card:(k,c)=>{if(k.s===3){c.chips+=10;c.mult+=2;return['+10 / +2','m']}}},
  jumeaux:{n:'Les Jumeaux',i:'👯',p:4,d:'Si la main est exactement une Paire : +30 Base et +3 Multi',
    hand:c=>{if(c.type==='paire'){c.chips+=30;c.mult+=3;return['+30 / +3','m']}}},
  triade:{n:'La Triade',i:'🔺',p:5,d:'Si la main contient un Brelan : +40 Base',
    hand:c=>{if(c.has.brelan){c.chips+=40;return['+40','c']}}},
  escalier:{n:"L'Escalier",i:'🪜',p:5,d:'Si la main contient une Suite : +60 Base',
    hand:c=>{if(c.has.suite){c.chips+=60;return['+60','c']}}},
  peintre:{n:'Le Peintre',i:'🎨',p:6,d:'Si la main contient une Couleur : +2 Multi par carte qui compte',
    hand:c=>{if(c.has.couleur){const v=2*c.scoring.length;c.mult+=v;return['+'+v+' Multi','m']}}},
  cour:{n:'La Cour',i:'👑',p:5,d:'Chaque figure (V, D, R) qui compte : +15 Base et +1 Multi',
    card:(k,c)=>{if(k.r>=11&&k.r<=13){c.chips+=15;c.mult+=1;return['+15 / +1','m']}}},
  fretin:{n:'Menu fretin',i:'🐟',p:5,d:'Chaque carte de 2 à 5 qui compte : +4 Multi',
    card:(k,c)=>{if(k.r<=5){c.mult+=4;return['+4 Multi','m']}}},
  tirelire:{n:'La Tirelire',i:'🐷',p:6,d:'Si tu possèdes 20 $ ou plus : ×2 Multi',
    hand:c=>{if(G.money>=20){c.mult*=2;return['×2 Multi','m']}}},
  souffle:{n:'Dernier souffle',i:'🌬️',p:6,d:'Dernière main du défi : +25 Multi',
    hand:c=>{if(c.last){c.mult+=25;return['+25 Multi','m']}}},
  econome:{n:"L'Économe",i:'🧮',p:5,d:'+3 Multi par défausse restante',
    hand:c=>{const v=G.discards*3;if(v){c.mult+=v;return['+'+v+' Multi','m']}}},
  solitude:{n:'La Solitude',i:'🌙',p:5,d:"+15 Base par emplacement d'Atout vide",
    hand:c=>{const v=(MAX_ATOUTS-G.atouts.length)*15;if(v){c.chips+=v;return['+'+v,'c']}}},
  bourgeon:{n:'Le Bourgeon',i:'🌱',p:6,d:a=>'Gagne +1 Multi à chaque main contenant une Paire (actuel : +'+(a?a.v:0)+')',
    hand:(c,a)=>{if(a.v){c.mult+=a.v;return['+'+a.v+' Multi','m']}},after:(c,a)=>{if(c.has.paire)a.v++},val:a=>'+'+a.v},
  ancien:{n:"L'Ancien",i:'🧙',p:6,d:'Chaque As qui compte : +20 Base et +4 Multi',
    card:(k,c)=>{if(k.r===14){c.chips+=20;c.mult+=4;return['+20 / +4','m']}}},
  banquier:{n:'Le Banquier',i:'🎩',p:5,d:'Fin de défi : +1 $ de plus par main non jouée',end:()=>G.hands},
  minimaliste:{n:'Le Minimaliste',i:'◽',p:5,d:'Si tu joues une seule carte : ×3 Multi',
    hand:c=>{if(c.n===1){c.mult*=3;return['×3 Multi','m']}}},
  echo:{n:"L'Écho",i:'🗣️',p:7,d:'La 1re carte qui compte est comptée deux fois'},
  cloche:{n:'La Cloche',i:'🔔',p:5,d:'Chaque 10 qui compte est compté deux fois'},
  page:{n:'Le Page',i:'🎒',p:5,d:'Chaque Valet resté en main : +30 Base',
    held:(k,c)=>{if(k.r===11){c.chips+=30;return['+30','c']}}},

function ensureAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}

}
function tone(f,d,type,vol,delay,f2){
  if(muted||!AC)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'triangle';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+0.03);
}
function noise(d,vol,delay,freq,q){
  if(muted||!AC)return;
  if(!NB){NB=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
  const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;f.type='bandpass';f.frequency.value=freq||3000;f.Q.value=q||1;
  g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+d+0.03);
}
function cardFlick(delay,vol){
  if(muted||!AC)return;
  if(!NB){NB=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
  const t=AC.currentTime+(delay||0),v=vol||1;
  // glissement de la carte (frottement qui descend dans l'aigu)
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;f.type='bandpass';f.Q.value=0.9;f.frequency.setValueAtTime(5200,t);f.frequency.exponentialRampToValueAtTime(1800,t+0.07);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.32*v,t+0.018);g.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
  s.connect(f).connect(g).connect(AC.destination);s.start(t,Math.random()*0.4);s.stop(t+0.1);
  // claquement sec quand elle se pose
  const s2=AC.createBufferSource(),hp=AC.createBiquadFilter(),g2=AC.createGain(),t2=t+0.062;
  s2.buffer=NB;hp.type='highpass';hp.frequency.value=2200;
  g2.gain.setValueAtTime(0.55*v,t2);g2.gain.exponentialRampToValueAtTime(0.0001,t2+0.022);
  s2.connect(hp).connect(g2).connect(AC.destination);s2.start(t2,Math.random()*0.4);s2.stop(t2+0.03);
  // petit choc mat sur le tapis
  const o=AC.createOscillator(),g3=AC.createGain();o.type='sine';o.frequency.setValueAtTime(190,t2);o.frequency.exponentialRampToValueAtTime(80,t2+0.05);
  g3.gain.setValueAtTime(0.18*v,t2);g3.gain.exponentialRampToValueAtTime(0.0001,t2+0.06);o.connect(g3).connect(AC.destination);o.start(t2);o.stop(t2+0.07);
}

// =============== Évaluation des mains ===============
function evaluate(cs){
  const cnt={};cs.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);
  const groups=Object.entries(cnt).map(([r,n])=>({r:+r,n})).sort((a,b)=>b.n-a.n||b.r-a.r);
  const g0=groups[0]?groups[0].n:0,g1=groups[1]?groups[1].n:0;
  const flush=cs.length===5&&cs.every(c=>c.s===cs[0].s);
  let straight=false;
  if(cs.length===5&&groups.length===5){
    const rs=groups.map(g=>g.r).sort((a,b)=>a-b);
    straight=rs[4]-rs[0]===4||rs.join()==='2,3,4,5,14';
  }
  const has={paire:g0>=2,double:g0>=2&&g1>=2,brelan:g0>=3,suite:straight,couleur:flush,carre:g0>=4};
  const of=rs=>cs.filter(c=>rs.includes(c.r));
  let type,scoring;
  if(straight&&flush){type='qf';scoring=cs}
  else if(g0===4){type='carre';scoring=of([groups[0].r])}
  else if(g0===3&&g1>=2){type='full';scoring=cs}
  else if(flush){type='couleur';scoring=cs}
  else if(straight){type='suite';scoring=cs}
  else if(g0===3){type='brelan';scoring=of([groups[0].r])}
  else if(g0===2&&g1===2){type='double';scoring=of([groups[0].r,groups[1].r])}
  else if(g0===2){type='paire';scoring=of([groups[0].r])}
  else{const hi=cs.reduce((a,b)=>b.r>a.r?b:a);type='haute';scoring=[hi]}
  return{type,scoring,has};
}

const BULBS={frame:['#ffffff','#b46bff',12,24,-6],goal:['#fff3c0','#ffae1a',9,17,-1],score:['#f1e4ff','#9b5cff',9,17,-1]};
const lastSize=new WeakMap();
function bulbify(el,key,force){
  const [c,c2,size,gap,off]=BULBS[key];
  const w=el.clientWidth,h=el.clientHeight,ls=lastSize.get(el);
  if(!force&&ls&&ls[0]===w&&ls[1]===h)return;lastSize.set(el,[w,h]);
  el.querySelectorAll(':scope>.bl').forEach(b=>b.remove());
  const inset=size/2+(off<0?-off*0+4:4),x0=inset,y0=inset,x1=w-inset,y1=h-inset;
  const pts=[],seg=(ax,ay,bx,by)=>{const L=Math.hypot(bx-ax,by-ay),n=Math.max(1,Math.round(L/gap));for(let i=0;i<n;i++)pts.push([ax+(bx-ax)*i/n,ay+(by-ay)*i/n])};
  seg(x0,y0,x1,y0);seg(x1,y0,x1,y1);seg(x1,y1,x0,y1);seg(x0,y1,x0,y0);
  const frag=document.createDocumentFragment();
  pts.forEach((p,i)=>{const b=document.createElement('i');b.className='bl p'+(i%3);
    b.style.cssText=`width:${size}px;height:${size}px;left:${p[0]-size/2}px;top:${p[1]-size/2}px;--c:${c};--c2:${c2}`;frag.appendChild(b)});
  el.appendChild(frag);
}
function buildBulbs(){bulbify($('#frame'),'frame',true);bulbify($('.goal'),'goal');bulbify($('.scorebox'),'score')}
function lightsFast(ms){document.body.classList.add('fast');setTimeout(()=>document.body.classList.remove('fast'),ms)}

// =============== Effets de victoire ===============
async function boomFx(){
  const sc=$('#score');sc.classList.remove('warm','hot');sc.classList.add('boom');$('#barBox').classList.remove('hot');
  sBoom();lightsFast(2400);
  const f=$('#flashFx');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');
  const r=sc.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const cols=['#ffd23f','#ff4d6d','#4dd6ff','#7cff6b','#ff9f1c','#fff'];
  for(let i=0;i<40;i++){
    const s=document.createElement('div');s.className='spark';
    const ang=Math.random()*Math.PI*2,dist=70+Math.random()*170;
    s.style.left=cx+'px';s.style.top=cy+'px';s.style.background=pick(cols);
    s.style.setProperty('--dx',Math.cos(ang)*dist+'px');s.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
  }
  await sleep(900);sc.classList.remove('boom');
}

// =============== Actions ===============
function toggle(id){
  if(G.busy)return;ensureAudio();
  if(G.sel.has(id))G.sel.delete(id);else if(G.sel.size<5)G.sel.add(id);else return;
  sSelect();$('#table').innerHTML='';render();
}
function discard(){
  if(G.busy||!G.sel.size||G.discards<=0)return;
  const cs=G.hand.filter(c=>G.sel.has(c.id));
  G.hand=G.hand.filter(c=>!G.sel.has(c.id));G.sel.clear();G.discards--;
  G.atouts.forEach(a=>{const d=ATOUTS[a.id];if(d.discard){d.discard(cs,a);flash(a.uid)}});
  drawCards();$('#table').innerHTML='';render();
}
async function play(){
  if(G.busy||!G.sel.size||G.hands<=0)return;
  G.busy=true;ensureAudio();
  const cards=G.hand.filter(c=>G.sel.has(c.id));
  G.hand=G.hand.filter(c=>!G.sel.has(c.id));G.sel.clear();G.hands--;
  const ev=evaluate(cards),v=lvlVals(ev.type);
  const ctx={chips:v.c,mult:v.m,type:ev.type,has:ev.has,n:cards.length,last:G.hands===0,first:G.playedThisDefi===0,scoring:ev.scoring};
  G.playedThisDefi++;
  const t=$('#table');t.innerHTML='';const els={};
  const sIds=new Set(ev.scoring.map(c=>c.id));
  cards.forEach(c=>{const e=cardEl(c);e.classList.add(sIds.has(c.id)?'score':'dim');els[c.id]=e;t.appendChild(e)});
  render();
  $('#handName').innerHTML=HANDS[ev.type].n+' <span class="lv">niv. '+G.levels[ev.type]+'</span>';
  setCalc(ctx);sPlay();
  await sleep(420);
  let idx=0,step=0;
  // 1) Cartes qui comptent
  for(const c of cards){
    if(!sIds.has(c.id))continue;
    const reps=1+((has('echo')&&idx===0)?1:0)+((has('cloche')&&c.r===10)?1:0);
    idx++;
    for(let r=0;r<reps;r++){
      if(r>0){pop(els[c.id],'Encore !','g');await sleep(240)}
      const ch=cardChips(c);ctx.chips+=ch;pop(els[c.id],'+'+ch,'c');setCalc(ctx,'c');sChip(step++);await sleep(260);
      if(c.enh==='flamme'){ctx.mult+=5;pop(els[c.id],'+5 Multi','m');setCalc(ctx,'m');sMult();await sleep(240)}
      if(c.enh==='cristal'){ctx.chips+=35;pop(els[c.id],'+35','c');setCalc(ctx,'c');sChip(step++);await sleep(240)}
      if(c.enh==='doree'){gain(2);pop(els[c.id],'+2 $','g');await sleep(240)}
      for(const a of G.atouts){
        const d=ATOUTS[a.id];if(!d.card)continue;
        const res=d.card(c,ctx,a);
        if(res){pop(els[c.id],res[0],res[1]);flash(a.uid);setCalc(ctx,res[1]);sfx(res[1],step++);await sleep(260)}
      }
    }
  }
  // 2) Cartes restées en main
  for(const c of G.hand){
    const he=handEl(c.id);
    if(c.enh==='acier'){ctx.chips+=25;pop(he,'+25','c');setCalc(ctx,'c');sChip(step++);await sleep(240)}
    for(const a of G.atouts){
      const d=ATOUTS[a.id];if(!d.held)continue;
      const res=d.held(c,ctx,a);
      if(res){pop(he,res[0],res[1]);flash(a.uid);setCalc(ctx,res[1]);sfx(res[1],step++);await sleep(260)}
    }
  }
  // 3) Atouts globaux, de gauche à droite
  for(const a of G.atouts){
    const d=ATOUTS[a.id];if(!d.hand)continue;
    const res=d.hand(ctx,a);
    if(res){flash(a.uid,res);setCalc(ctx,res[1]);sfx(res[1],step++);await sleep(330)}
  }
  G.atouts.forEach(a=>{const d=ATOUTS[a.id];if(d.after)d.after(ctx,a)});
  renderAtouts();
  const total=Math.floor(ctx.chips*ctx.mult);
  $('#total').textContent='= '+fmt(total);
  await sleep(350);
  const from=G.score,to=G.score+total,steps=22;
  for(let i=1;i<=steps;i++){G.score=Math.floor(from+(to-from)*i/steps);updateScore();if(i%2)sTick();await sleep(30)}
  G.score=to;updateScore();
  await sleep(450);
  t.innerHTML='';$('#total').textContent='';
  if(G.score>=target()){await boomFx();winDefi();return}
  if(G.hands<=0){gameOver();return}
  drawCards();G.busy=false;render();
}

// =============== Fin de défi / boutique ===============
function winDefi(){
  const base=DEFI_REWARD[G.defi];
  const cap=has('avare')?10:5;
  const interest=Math.min(cap,Math.floor(G.money/5));
  const hb=G.hands;
  let extra=0;G.atouts.forEach(a=>{const d=ATOUTS[a.id];if(d.end)extra+=d.end(a)||0});
  const tot=base+interest+hb+extra;G.money+=tot;G.busy=false;
  const finalWin=G.mise===8&&G.defi===2;
  setBest(G.mise*3+G.defi+1);
  sWin();
  let html=`<h3>${finalWin?'Victoire ! 🏆':DEFIS[G.defi]+' réussi ! 🎉'}</h3>`+(finalWin?'<p>Tu as battu le Défi du Maître de la Mise 8. Coup de maître !</p>':'')+
    `<p>Score ${fmt(G.score)} / ${fmt(target())}</p>
    <div class="sumrow"><span>Récompense du défi</span><b>+$${base}</b></div>
    <div class="sumrow"><span>Mains restantes (${hb})</span><b>+$${hb}</b></div>
    <div class="sumrow"><span>Intérêts (1 $ par 5 $, max ${cap})</span><b>+$${interest}</b></div>`+
    (extra?`<div class="sumrow"><span>Atouts</span><b>+$${extra}</b></div>`:'')+
    `<div class="sumrow"><span><b>Total</b></span><b style="color:var(--gold)">+$${tot}</b></div>`;
  if(finalWin)modal(html,[{t:'Nouvelle partie',c:'ghost',f:()=>{closeModal();newRun()}},{t:'Continuer (infini)',c:'goldb',f:()=>{closeModal();openShop()}}],true);
  else modal(html,[{t:'Boutique →',c:'goldb',f:()=>{closeModal();openShop()}}],true);
  render();
}
function gameOver(){
  G.busy=false;G.phase='over';sLose();
  const best=getBest();
  modal(`<h3>Partie terminée</h3><p>Le ${DEFIS[G.defi]} de la Mise ${G.mise} t'a eu : ${fmt(G.score)} / ${fmt(target())}.</p>
    <p class="small">Record : ${best?('Mise '+Math.ceil(best/3)):'—'}</p>`,
    [{t:'Rejouer',c:'goldb',f:()=>{closeModal();newRun()}}],true);
  render();
}
function rollShop(){
  const owned=new Set(G.atouts.map(a=>a.id));
  const pool=shuffle(Object.keys(ATOUTS).filter(k=>!owned.has(k)));
  G.shop={atouts:pool.slice(0,2),scroll:pick(Object.keys(HANDS)),charme:randomCharme()};
}
function openShop(){G.phase='shop';G.reroll=5;rollShop();render()}
function renderShop(){
  const s=$('#shop');
  const full=G.atouts.length>=MAX_ATOUTS;
  let h=`<h2>Boutique <span class="money" style="float:right">$${G.money}</span></h2>
    <div class="small">Atouts ${G.atouts.length}/${MAX_ATOUTS} · Charmes ${G.charmes.length}/${MAX_CH} · touche un Atout ou un Charme en haut pour le vendre</div><div class="offers">`;
  G.shop.atouts.forEach((id,i)=>{
    if(!id){h+=`<div class="offer sold"><div class="nm">Vendu</div></div>`;return}
    const d=ATOUTS[id],ok=G.money>=d.p&&!full;
    h+=`<div class="offer"><div class="tag">ATOUT</div><div class="top"><span class="ic">${d.i}</span><span class="nm">${d.n}</span></div>
      <div class="ds">${descOf(id,{v:0})}</div><button class="btn goldb" data-ba="${i}" ${ok?'':'disabled'}>${full?'Plus de place':'Acheter $'+d.p}</button></div>`;
  });
  const k=G.shop.scroll;
  if(!k)h+=`<div class="offer sold scroll"><div class="nm">Vendu</div></div>`;
  else{const hd=HANDS[k],pr=scrollPrice();
    h+=`<div class="offer scroll"><div class="tag">PARCHEMIN</div><div class="top"><span class="ic">📜</span><span class="nm">${hd.n}</span></div>
      <div class="ds">${hd.n} passe au niveau ${G.levels[k]+1} (+${hd.dc} Base, +${hd.dm} Multi)</div>
      <button class="btn goldb" id="buyScroll" ${G.money>=pr?'':'disabled'}>Acheter $${pr}</button></div>`}
  const ch=G.shop.charme;
  if(!ch)h+=`<div class="offer sold charm"><div class="nm">Vendu</div></div>`;
  else{const d=CHARMES[ch.id],chFull=G.charmes.length>=MAX_CH;
    h+=`<div class="offer charm"><div class="tag">CHARME</div><div class="top"><span class="ic">${d.i}</span><span class="nm">${chName(ch)}</span></div>
      <div class="ds">${chDesc(ch)}</div>
      <button class="btn goldb" id="buyCharme" ${G.money>=d.p&&!chFull?'':'disabled'}>${chFull?'Plus de place':'Acheter $'+d.p}</button></div>`}
  const rp=rerollPrice();
  h+=`</div><button class="btn reroll" id="btnReroll" ${G.money>=rp?'':'disabled'}>🔄 Changer toutes les offres — $${rp}</button>
    <div class="shopbar"><button class="btn play" id="btnNext">Défi suivant →</button></div>`;
  s.innerHTML=h;
  s.querySelectorAll('[data-ba]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.ba,id=G.shop.atouts[i],d=ATOUTS[id];
    if(G.money<d.p||G.atouts.length>=MAX_ATOUTS)return;
    G.money-=d.p;G.atouts.push({uid:++uidc,id,v:0});G.shop.atouts[i]=null;sBuy();render();
  });
  const bs=$('#buyScroll');if(bs)bs.onclick=()=>{
    const pr=scrollPrice();if(G.money<pr)return;
    G.money-=pr;G.levels[G.shop.scroll]++;G.shop.scroll=null;
    G.atouts.forEach(a=>{if(a.id==='astrologue')a.v+=2});
    sBuy();render();
  };
  const bc=$('#buyCharme');if(bc)bc.onclick=()=>{
    const c=G.shop.charme,d=CHARMES[c.id];if(G.money<d.p||G.charmes.length>=MAX_CH)return;
    G.money-=d.p;G.charmes.push(c);G.shop.charme=null;sBuy();render();
  };
  $('#btnReroll').onclick=()=>{const p=rerollPrice();if(G.money<p)return;G.money-=p;G.reroll++;rollShop();sShuffle();render()};
  $('#btnNext').onclick=()=>{G.defi++;if(G.defi>2){G.defi=0;G.mise++}startDefi()};
}

// =============== Modales ===============
function modal(html,btns,lock){
  G.lock=!!lock;
  const b=$('#modalBox');b.innerHTML=html+'<div class="btns"></div>';
  const w=b.querySelector('.btns');
  (btns||[{t:'OK',c:'ghost',f:closeModal}]).forEach(x=>{const e=document.createElement('button');e.className='btn '+x.c;e.textContent=x.t;e.onclick=x.f;w.appendChild(e)});
  $('#modal').hidden=false;
}
function closeModal(){$('#modal').hidden=true;G.lock=false}
function atoutInfo(a){
  const d=ATOUTS[a.id],canSell=!G.busy&&G.phase!=='over';
  modal(`<h3>${d.i} ${d.n}</h3><p>${descOf(a.id,a)}</p><p class="small">Revente : $${sellOf(a.id)}</p>`,
    [{t:'Fermer',c:'ghost',f:closeModal}].concat(canSell?[{t:'Vendre +$'+sellOf(a.id),c:'disc',f:()=>{
      G.money+=sellOf(a.id);G.atouts=G.atouts.filter(x=>x.uid!==a.uid);sSell();closeModal();
      if(G.phase==='play'){G.hands=Math.min(G.hands,maxHands());drawCards()}render()}}]:[]));
}
function charmeInfo(c){
  const d=CHARMES[c.id],inPlay=G.phase==='play'&&!G.busy,n=G.sel.size,ok=inPlay&&n>=1&&n<=d.max;
  const hint=!inPlay?'Utilisable pendant un défi, sur les cartes de ta main.':ok?`${n} carte(s) sélectionnée(s) : prêt.`:`Sélectionne de 1 à ${d.max} carte(s) dans ta main, puis touche à nouveau ce Charme.`;
  const btns=[{t:'Fermer',c:'ghost',f:closeModal}];
  if(!G.busy&&G.phase!=='over')btns.push({t:'Vendre +$1',c:'disc',f:()=>{G.money+=1;G.charmes=G.charmes.filter(x=>x.uid!==c.uid);sSell();closeModal();render()}});
  if(ok)btns.push({t:'Utiliser',c:'goldb',f:()=>useCharme(c)});
  modal(`<h3>${d.i} ${chName(c)}</h3><p>${chDesc(c)}</p><p class="small">${hint}</p>`,btns);
}
function useCharme(c){
  const d=CHARMES[c.id],cs=G.hand.filter(k=>G.sel.has(k.id));
  if(!cs.length||cs.length>d.max)return;
  if(c.id==='purge'){
    const ids=new Set(cs.map(k=>k.id));
    G.cards=G.cards.filter(k=>!ids.has(k.id));G.hand=G.hand.filter(k=>!ids.has(k.id));drawCards();
  }else if(d.enh)cs.forEach(k=>k.enh=d.enh);
  else d.use(cs,c);
  G.charmes=G.charmes.filter(x=>x.uid!==c.uid);G.sel.clear();sortHand();
  sMagic();closeModal();$('#table').innerHTML='';render();
}
function showLevels(){
  let h='<h3>Mains de poker</h3><table class="lv">';
  Object.keys(HANDS).reverse().forEach(k=>{const v=lvlVals(k);h+=`<tr><td>${HANDS[k].n}</td><td class="small">niv. ${G.levels[k]}</td><td class="c">${v.c}</td><td>×</td><td class="m">${v.m}</td></tr>`});
  h+='</table><p class="small">Base en bleu, Multi en rouge. Les Parchemins de la boutique font monter le niveau.</p>';
  modal(h);
}
function showHelp(){
  modal(`<h3>Comment jouer</h3>
  <p>Chaque défi a un <b>objectif</b> de points. Tu as <b>4 mains</b> et <b>3 défausses</b> pour l'atteindre.</p>
  <p>Sélectionne jusqu'à 5 cartes et joue une main de poker. Score = <b style="color:#8fbaff">Base</b> × <b style="color:#ff9a9d">Multi</b>. Seules les cartes qui forment la combinaison <b>comptent</b> (entourées de bleu) : elles ajoutent leur valeur à la Base (figures 10, As 11).</p>
  <p>Chaque Mise comporte 3 défis : Petit, Grand, puis le Défi du Maître. Bats la <b>Mise 8</b> pour gagner.</p>
  <p>La <b>boutique</b> propose des <b>Atouts</b> (bonus permanents, 5 max, déclenchés de gauche à droite), des <b>Parchemins</b> (améliorent un type de main) et des <b>Charmes</b> (2 max, à utiliser pendant un défi sur des cartes sélectionnées : améliorations 🔥 💠 🪙 ⛓️, changement d'enseigne, de rang, ou destruction). Le bouton 🔄 change toutes les offres.</p>
  <p>Argent : récompense du défi + 1 $ par main non jouée + 1 $ d'intérêt par tranche de 5 $ (max 5).</p>`);
}

$('#btnPlay').onclick=play;
$('#btnDiscard').onclick=discard;
$('#sortRank').onclick=()=>{if(G.busy)return;G.sort='rank';sortHand();render()};
$('#sortSuit').onclick=()=>{if(G.busy)return;G.sort='suit';sortHand();render()};
$('#btnLevels').onclick=showLevels;
$('#btnHelp').onclick=showHelp;
$('#btnMute').onclick=()=>{muted=!muted;try{localStorage.setItem('cdm_mute',muted?'1':'0')}catch(e){}ensureAudio();render()};
if(IN_APP){$('#btnQuit').classList.remove('hidden');
  $('#btnQuit').onclick=()=>{if(G.busy)return;modal('<h3>Quitter la partie ?</h3><p>La partie en cours sera perdue.</p>',[{t:'Rester',c:'ghost',f:closeModal},{t:'Quitter',c:'disc',f:()=>{location.href='index.html'}}])}}
$('#modal').onclick=e=>{if(e.target.id==='modal'&&!G.lock)closeModal()};
document.addEventListener('pointerdown',ensureAudio);
window.addEventListener('resize',()=>bulbify($('#frame'),'frame',true));
if(window.ResizeObserver){const ro=new ResizeObserver(()=>{bulbify($('.goal'),'goal');bulbify($('.scorebox'),'score')});ro.observe($('.goal'));ro.observe($('.scorebox'))}
buildBulbs();
newRun();
</script>
